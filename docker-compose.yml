services:
  postgres:
    image: postgres:16-alpine
    container_name: coach_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coach_os
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coach_os
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - internal
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.coach-os.rule=Host(`app.hivesocial.agency`)"
      - "traefik.http.routers.coach-os.entrypoints=web,websecure"
      - "traefik.http.routers.coach-os.tls=true"
      - "traefik.http.routers.coach-os.tls.certresolver=mytlschallenge"
      - "traefik.http.services.coach-os.loadbalancer.server.port=3000"

volumes:
  pg_data:

networks:
  internal:
  root_default:
    external: true
